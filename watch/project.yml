# Capra for Apple Watch — standalone SwiftUI app (React Native doesn't run on
# watchOS). Generate the Xcode project on the Mac: `xcodegen` in this folder.
# The .xcodeproj is a build product — don't commit it.
name: CapraWatch
options:
  bundleIdPrefix: dev.redswoop
  deploymentTarget:
    watchOS: "11.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CapraWatch:
    type: application
    platform: watchOS
    sources: [CapraWatch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.redswoop.capra.watchkitapp
        PRODUCT_NAME: Capra
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Capra
        INFOPLIST_KEY_WKWatchOnly: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    info:
      path: CapraWatch/Info.plist
      properties:
        WKApplication: true
        WKWatchOnly: true
        CFBundleDisplayName: Capra

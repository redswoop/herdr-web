<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101014">
<title>herdr</title>
<link rel="stylesheet" href="/style.css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐑</text></svg>">
</head>
<body>
<div id="roster-view">
  <header class="bar">
    <h1>🐑 herd</h1>
    <span id="build" class="sub" title="server build · tap for details"></span>
    <button id="bell" class="ghost" hidden title="notify when an agent blocks">🔕</button>
    <span id="conn-dot" class="dot" title="daemon connection"></span>
  </header>
  <main id="roster"></main>
</div>

<div id="agent-view" hidden>
  <header class="bar">
    <button id="back" class="ghost" aria-label="back">←</button>
    <div class="who">
      <div id="agent-name"></div>
      <div id="agent-cwd" class="sub"></div>
    </div>
    <span id="agent-status" class="chip">—</span>
  </header>
  <div id="blocked-banner" hidden>
    <div class="banner-text">agent is waiting on you</div>
    <button id="show-screen" class="ghost">view screen</button>
  </div>
  <pre id="screen" hidden></pre>
  <main id="transcript"></main>
  <div id="blocked-card" hidden></div>
  <footer id="composer">
    <div id="keysrow" hidden>
      <button data-keys="Escape">esc</button>
      <button data-keys="Up">↑</button>
      <button data-keys="Down">↓</button>
      <button data-keys="Enter">⏎</button>
      <button data-keys="y">y</button>
      <button data-keys="n">n</button>
      <button data-keys="C-c">^C</button>
    </div>
    <div id="inputrow">
      <button id="kbd-toggle" class="ghost" aria-label="toggle key pad">⌨</button>
      <textarea id="prompt" rows="1" placeholder="prompt…" autocapitalize="off" autocomplete="off"></textarea>
      <button id="send">Send</button>
    </div>
  </footer>
</div>
<script src="/app.js"></script>
</body>
</html>
